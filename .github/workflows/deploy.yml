name: Build and Push Docker Image

# 1. TRIGGER: Run this script whenever code is pushed to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    # 2. RUNNER: Ask GitHub for a fresh, virtual Linux machine
    runs-on: ubuntu-latest

    steps:
      # Step A: Copy your project files onto the virtual machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Log in to Docker Hub using your saved secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step C: Build the Docker image and push it to Docker Hub
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-first-app:latest